<h2>Vervang je vergeten paswoord</h2>
@if (invalidToken()) {
  <ngb-alert type="danger">
    <p>
      We kunnen u helaas niet verder helpen. Uw link is ofwel vervallen (= ouder dan 1u) of ongeldig.
    </p>
    <p>
      Om uw wachtwoord reset opnieuw aan te vragen:
      <gimmi-forgot-password-link linkText="klik hier"></gimmi-forgot-password-link>
    </p>
  </ngb-alert>
} @else {
  <form class="form" (submit)="saveNewPassword($event)" novalidate>
    <gimmi-password-field [field]="resetPasswordForm.password" label="Wachtwoord" />
    @if (serverError()) {
      <div id="serverError" class="form-text text-danger"><small>{{serverError()}}</small></div>
    }
    <gimmi-password-field [field]="resetPasswordForm.passwordCheck" label="Wachtwoordcontrole"
      placeholder="Geef wachtwoord nogmaals in" />
    <button type="submit" class="btn btn-danger mt-3" [disabled]="resetPasswordForm().invalid()">Wijzig wachtwoord</button>
  </form>
}
