@if (preview) {
  <img [src]="preview" [class]="class + ' image preview'" alt="Gekozen afbeelding" />
} @else {
  <img [src]="src" [attr.srcset]="srcset" [attr.sizes]="srcset ? sizes : null"
    [class]="class + ' image' + (loaded ? '' : ' loading')" alt="Afbeelding van de wens" loading="lazy" decoding="async"
    (load)="loaded = true" (error)="notLoaded()" />
  }
