
<ng-template #customResultTemplate let-person="result" let-term="term">
  @if (person) {
    <div>
      @if (person.pic) {
        <img [src]="person.pic" alt="" class="me-2" style="width: 16px">
      }
      @if (!person.pic) {
        <fa-icon [icon]="userIcon" class="me-2"></fa-icon>
      }
      <ngb-highlight [result]="person.fullName" [term]="term"></ngb-highlight>
    </div>
  }
  @if (!person) {
    <div>
      <span>Persoon niet gevonden</span><br/>
      <b>Klik hier om hem/haar uit te nodigen</b>
    </div>
  }

</ng-template>

<div class="d-flex align-items-center" role="search">
  <div class="input-group input-group-sm">
    <span class="d-none d-sm-flex input-group-text"><fa-icon [icon]="searchIcon"></fa-icon></span>
    <input  id="typeahead-basic" type="text" class="form-control" placeholder="Zoek wensenlijst van..."
      #searchInput
      [ngbTypeahead]="search"
      [editable]="false"
      [focusFirst]="false"
      [inputFormatter]="inputFormatter"
      [resultTemplate]="customResultTemplate"
      (selectItem)="onPersonSelect($event)"
      />
    </div>
  </div>
