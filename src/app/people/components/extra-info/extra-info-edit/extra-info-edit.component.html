<div>
  <div class="h6">
    @switch (itemType) {
      @case ('likes') {
        <span>Waarmee kan men je een plezier doen?</span>
      }
      @case ('dislikes') {
        <span>Wat krijgt je liever niet?</span>
      }
    }
  </div>
  @for (item of formItems.controls; track item; let i = $index) {
    <div class="row g-0 mb-1">
      <ng-container [formGroup]="item">
        <div class="col-5 me-1">
          <input type="text" class="form-control form-control-sm" formControlName="text" placeholder="Beschrijving"/>
        </div>
        <div class="col-5 me-1">
          <input type="text" class="form-control form-control-sm" formControlName="url" placeholder="url (optioneel)"/>
        </div>
        <div class="col-1">
          <fa-icon [icon]="deleteIcon" (click)="removeItem(i)"></fa-icon>
        </div>
      </ng-container>
    </div>
  }
  <button type="button"
    class="btn btn-sm btn-outline btn-outline-success"
    (click)="addItem()"
    [disabled]="formItems.invalid">
    <fa-icon [icon]="addIcon"></fa-icon></button>
    @if (formItems.invalid) {
      <span class="text-danger font-sm font-sm ms-1">Beschrijving moet ingevuld worden (of verwijder lege lijn)</span>
    }
  </div>
