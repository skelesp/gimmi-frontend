@if (items?.length) {
  <div>
    <div class="h6">
      @switch (itemType()) {
        @case ('likes') {
          <span>Waarmee kan je {{firstName()}} een plezier doen?</span>
        }
        @case ('dislikes') {
          <span>Wat krijgt {{firstName()}} liever niet?</span>
        }
      }
    </div>
    <div class="font-sm">
      <ul>
        @for (item of items; track item) {
          <li>
            @if (!item.url) {
              <span>{{item.text}}</span>
            }
            @if (item.url) {
              <a [href]="item.url" target="_blank">{{item.text}}</a>
            }
          </li>
        }
      </ul>
    </div>
  </div>
}
