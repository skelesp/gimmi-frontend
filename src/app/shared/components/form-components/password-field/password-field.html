<div>
  @if (label()) {
    <label [for]="inputId()">{{ label() }}</label>
  }
  <div class="input-group mb-2">
    <span class="input-group-text">
      <fa-icon [icon]="passwordIcon"></fa-icon>
    </span>
    <input
      [id]="inputId()"
      [formField]="field()"
      [type]="showPassword() ? 'text' : 'password'"
      class="form-control"
      [placeholder]="placeholder()">
    <button
      type="button"
      class="btn btn-outline-secondary border-secondary"
      [attr.aria-label]="showPassword() ? 'Verberg wachtwoord' : 'Toon wachtwoord'"
      [attr.aria-pressed]="showPassword()"
      (click)="toggleShowPassword()">
      <fa-icon [icon]="showPassword() ? eyeSlashIcon : eyeIcon"></fa-icon>
    </button>
  </div>
  @if (field()().touched() && field()().invalid()) {
    <div id="passwordErrors" class="form-text text-danger">
      @for (error of field()().errors(); track error.kind) {
        <small>{{ error.message }}</small>
      }
    </div>
  }
</div>
