<div [formGroup]='parentFormGroup'>
  @if (label) {
    <label [for]="inputId">{{label}}</label>
  }
  <div class="input-group mb-2">
    <span class="input-group-text">
      <fa-icon [icon]="passwordIcon"></fa-icon>
    </span>
    <input
      [id]="inputId"
      [type]="showPassword ? 'text' : 'password'"
      class="form-control"
      [placeholder]="placeholder"
      [formControlName]="controlName">
      <button
        type="button"
        class="btn btn-outline-secondary border-secondary"
        [attr.aria-label]="showPassword ? 'Verberg wachtwoord' : 'Toon wachtwoord'"
        [attr.aria-pressed]="showPassword"
        (click)="toggleShowPassword()">
        <fa-icon [icon]="showPasswordIcon"></fa-icon>
      </button>
    </div>
    @if (!parentFormGroup.get(controlName).valid && parentFormGroup.get(controlName).touched) {
      <div id="passwordErrors" class="form-text text-danger"
        >
        @if (parentFormGroup.get(controlName).errors?.required) {
          <small>Wachtwoord is een verplicht veld.</small>
        }
      </div>
    }
  </div>
