<div class="custom-toast border border-{{toast.type}}">
    <div class="toast-header">
        <span class="badge rounded-pill bg-{{toast.type}} text-{{toast.type}} me-2">.</span>
        <strong class="me-auto">{{toast.caption}}</strong>
        <button type="button" class="btn-close ms-2 mb-1" (click)="toast.close()" aria-label="Close"></button>
    </div>
    <div class="toast-body">
        <div [innerHTML]='toast.text'></div>
    </div>
</div>
