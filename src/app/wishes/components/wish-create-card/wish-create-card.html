<div class="card border border-danger shadow">
    <!-- Image header of create wish card -->
    <!-- https://stackoverflow.com/questions/43009351/how-to-make-links-work-with-card-img-overlay-in-bootstrap-v4 -->
    <div class="position-relative pt-2 pb-md-3 pb-5">
        <gimmi-image-view 
            class="card-img-top rounded img-fluid thumbnail inline"
        ></gimmi-image-view>
        <button type="button" class="card-img-overlay blurred-card-overlay pointer w-100 h-100 border-0 rounded-0 d-flex flex-column justify-content-start" (click)="openCreateWish()">
            <span class="d-block text-center">
                <fa-icon [icon]='plusIcon' size='4x'></fa-icon>
                <br />
                <span class="h5 fw-bold">Voeg wens toe</span>
            </span>
        </button>
    </div>
</div>
