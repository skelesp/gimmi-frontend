@if (bannerConfig?.text) {
  <span
        [ngClass]="{
            'w-75 badge fw-normal text-wrap text-center badge-multiline disabled': true,
            'badge-wish-card-banner': true,
            'text-bg-warning': bannerConfig.backgroundColor === 'warning',
            'text-bg-danger': bannerConfig.backgroundColor === 'danger',
            'text-bg-success': bannerConfig.backgroundColor === 'success'
        }"
    ><fa-icon [icon]="bannerConfig.bannerIcon"></fa-icon> {{bannerConfig.text}}
  </span>
}
