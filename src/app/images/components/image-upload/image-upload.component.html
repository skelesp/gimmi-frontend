<button class="btn btn-danger btn-sm" type="button" (click)="wissel()"
        [attr.aria-expanded]="open" aria-controls="afbeeldingskiezer">
    <i class="fa fa-camera mr-1" aria-hidden="true"></i> Kies afbeelding
</button>

<div *ngIf="open" id="afbeeldingskiezer" class="card mt-2 kiezer" role="region" aria-label="Afbeeldingskiezer">
    <div class="card-header py-1 px-2 d-flex align-items-center">
        <ul class="nav nav-tabs card-header-tabs flex-grow-1" role="tablist">
            <li class="nav-item">
                <button type="button" class="nav-link" role="tab" [class.active]="tab === 'zoeken'"
                        [attr.aria-selected]="tab === 'zoeken'" (click)="kiesTab('zoeken')">Zoeken</button>
            </li>
            <li class="nav-item">
                <button type="button" class="nav-link" role="tab" [class.active]="tab === 'bestand'"
                        [attr.aria-selected]="tab === 'bestand'" (click)="kiesTab('bestand')">Foto / bestand</button>
            </li>
        </ul>
        <button type="button" class="close ml-2" aria-label="Sluit afbeeldingskiezer" (click)="sluit()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="card-body p-2">
        <div *ngIf="uploadFout" class="alert alert-warning py-1 px-2 mb-2 small" role="alert">{{ uploadFout }}</div>

        <div *ngIf="tab === 'zoeken'" role="tabpanel">
            <div class="input-group input-group-sm mb-2" role="search">
                <input type="search" class="form-control" placeholder="Zoek een afbeelding"
                       aria-label="Zoekterm voor afbeeldingen" maxlength="200"
                       [(ngModel)]="zoekterm" [ngModelOptions]="{standalone: true}"
                       (keydown.enter)="zoekMetEnter($event)" />
                <div class="input-group-append">
                    <button class="btn btn-outline-danger" type="button" (click)="zoek()" [disabled]="zoeken">Zoek</button>
                </div>
            </div>

            <p *ngIf="zoeken" class="small text-muted mb-2">
                <span class="spinner-border spinner-border-sm mr-1" aria-hidden="true"></span>Zoeken…
            </p>
            <div *ngIf="zoekFout" class="alert alert-warning py-1 px-2 mb-2 small" role="alert">{{ zoekFout }}</div>
            <p *ngIf="!zoeken && resultaten?.length === 0" class="small text-muted mb-2">
                Geen afbeeldingen gevonden. Probeer een andere zoekterm.
            </p>
            <p *ngIf="!zoeken && resultaten === null && !zoekFout" class="small text-muted mb-2">
                Geef een zoekterm in, bijvoorbeeld de naam van het product.
            </p>

            <div *ngIf="!zoeken && resultaten?.length" class="raster">
                <button *ngFor="let r of resultaten" type="button" class="resultaat"
                        [class.bezig]="bezigMet === r.url" [class.mislukt]="mislukt.has(r.url)"
                        [disabled]="!!bezigMet || mislukt.has(r.url)"
                        [title]="r.title + (r.source ? ' (' + r.source + ')' : '')"
                        (click)="kies(r)">
                    <img [src]="r.thumbnail" [alt]="r.title" loading="lazy" referrerpolicy="no-referrer" />
                    <span *ngIf="bezigMet === r.url" class="spinner-border spinner-border-sm text-light" role="status">
                        <span class="sr-only">Bezig met opladen</span>
                    </span>
                </button>
            </div>
            <p class="small text-muted mb-0 mt-1">Zoekresultaten van Brave Search</p>
        </div>

        <div *ngIf="tab === 'bestand'" role="tabpanel">
            <p class="small mb-2">Neem een foto of kies een afbeelding van je toestel.</p>
            <label *ngIf="toonCamera" class="btn btn-outline-danger btn-sm mr-2 mb-1" [class.disabled]="!!bezigMet">
                <i class="fa fa-camera mr-1" aria-hidden="true"></i> Foto nemen
                <input type="file" accept="image/*" capture="environment" class="d-none"
                       [disabled]="!!bezigMet" (change)="bestandGekozen($event)" />
            </label>
            <label class="btn btn-outline-danger btn-sm mb-1" [class.disabled]="!!bezigMet">
                <i class="fa fa-folder-open mr-1" aria-hidden="true"></i> Bestand kiezen
                <input type="file" accept="image/*" class="d-none" data-testid="bestand-kiezen"
                       [disabled]="!!bezigMet" (change)="bestandGekozen($event)" />
            </label>
            <p *ngIf="bezigMet === 'bestand'" class="small text-muted mb-0 mt-1">
                <span class="spinner-border spinner-border-sm mr-1" aria-hidden="true"></span>Bezig met opladen…
            </p>
        </div>
    </div>
</div>
