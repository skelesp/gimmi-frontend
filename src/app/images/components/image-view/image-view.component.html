<img *ngIf="preview; else cloudinary" [src]="preview" [class]="class + ' voorvertoning'" alt="Gekozen afbeelding" />
<ng-template #cloudinary>
    <cl-image [public-id]='image.publicId'
        [attr.version]='image.version'
        [class]="class">
        <cl-transformation fetch-format="auto"></cl-transformation>
        <cl-placeholder type="predominant"></cl-placeholder>
    </cl-image>
</ng-template>
