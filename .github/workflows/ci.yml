# Build en unittests op elke push en PR (sc-2044).
# Cloudflare Pages bouwt en publiceert zelf; deze check houdt via de ruleset kapotte code
# uit develop en master.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Vitest draait in echte Chromium (Playwright); faalt onder de coverage-drempels in angular.json (sc-2979).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/gimmi
          if-no-files-found: ignore

  # De gegenereerde types (src/app/core/api/schema.ts) moeten overeenkomen met het contract van de
  # testomgeving (sc-3282). Aparte job, niet verplicht in de ruleset: een nieuwe backendrelease zonder
  # nieuwe types is zichtbaar zonder andere PR's te blokkeren. Herstel: `npm run api:types` en committen.
  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run api:types
      - run: git diff --exit-code -- src/app/core/api/schema.ts
